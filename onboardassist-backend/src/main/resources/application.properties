spring.application.name=onboardassist-backend
server.port=8095

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/onboardassist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT & Gemini
# ===============================
jwt.secret=OnboardAssistSuperSecretKey2024JWTSecretKeyForSigningTokens
jwt.expiration=86400000

gemini.api.key=YOUR_API_KEYgemini.embedding.model=gemini-embedding-001
gemini.chat.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com

# CORS
app.cors.allowed-origins=http://localhost:4200